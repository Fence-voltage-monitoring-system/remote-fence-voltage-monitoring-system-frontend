<div class="backdrop fixed inset-0 z-[2000] flex items-center justify-center p-4 bg-[#020703]/75 backdrop-blur-[1px]" [class.is-closing]="isClosing" (click)="close()">
  <aside class="drawer relative z-[2001] flex flex-col max-h-[calc(100dvh-2rem)] w-full max-w-[820px] overflow-hidden rounded-2xl border border-[#304632] bg-[#142a19] px-8 py-5 shadow-2xl" (click)="$event.stopPropagation()" [class.is-closing]="isClosing" role="dialog" aria-modal="true" aria-labelledby="section-register-title">
    <header class="mb-4 flex shrink-0 items-start justify-between"><div><h2 id="section-register-title" class="text-lg font-extrabold text-white">Register Section</h2><p class="mt-0.5 text-xs text-[#91a494]">Add a fence section for monitoring</p></div><button class="close" type="button" (click)="close()" aria-label="Close">×</button></header>
    <form class="flex min-h-0 flex-1 flex-col gap-2.5 overflow-y-auto pr-1" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field"><label for="parent-fence">Parent Fence</label><select id="parent-fence" class="control font-semibold" formControlName="fenceCode">@for(fence of fences;track fence.code){<option [value]="fence.code">{{fence.code}} · {{fence.name}}</option>}</select></div>
      <div class="field"><label for="section-code">Section ID </label><input id="section-code" class="control font-mono" formControlName="sectionCode" /></div>
      <div class="grid grid-cols-2 gap-3"><div class="field"><label for="start-lat">Start Latitude</label><input id="start-lat" class="control font-mono" type="number" step=".0001" formControlName="startLatitude" /></div><div class="field"><label for="start-lng">Start Longitude</label><input id="start-lng" class="control font-mono" type="number" step=".0001" formControlName="startLongitude" /></div></div>
      <div class="grid grid-cols-2 gap-3"><div class="field"><label for="end-lat">End Latitude</label><input id="end-lat" class="control font-mono" type="number" step=".0001" formControlName="endLatitude" /></div><div class="field"><label for="end-lng">End Longitude</label><input id="end-lng" class="control font-mono" type="number" step=".0001" formControlName="endLongitude" /></div></div>
      <div class="grid grid-cols-2 gap-3"><div class="field"><label for="section-length">Section Length (km)</label><input id="section-length" class="control" type="number" min=".1" step=".1" formControlName="lengthKm" /></div><div class="field"><label for="assigned-device">Monitoring Device (Node)</label><select id="assigned-device" class="control font-semibold" formControlName="deviceId"><option [ngValue]="null">-- None (Unassigned) --</option>@for(dev of availableDevices;track dev.id){<option [value]="dev.id.toString()">{{dev.name}} ({{dev.serial}})</option>}</select></div></div>
      @if(form.touched&&form.invalid){<p class="error">Complete all required fields using valid coordinates.</p>}
      @if(error){<p class="error" role="alert">{{error}}</p>}@if(saving){<p role="status">Saving...</p>}
      <footer class="mt-auto shrink-0 grid grid-cols-[.8fr_1.4fr] gap-3 pt-2"><button class="secondary" type="button" [disabled]="isClosing||saving" (click)="close()">Cancel</button><button class="primary" type="submit" [disabled]="isClosing||saving">＋ Register Section</button></footer>
    </form>
  </aside>
</div>
