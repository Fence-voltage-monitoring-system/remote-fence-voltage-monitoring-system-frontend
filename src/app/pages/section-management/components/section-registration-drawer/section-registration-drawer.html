<div class="backdrop absolute inset-0 bg-[#020703]/75 backdrop-blur-[1px]" [class.is-closing]="isClosing" (click)="close()"></div>
<aside class="drawer absolute inset-y-0 right-0 w-full max-w-[500px] overflow-y-auto border-l border-[#304632] bg-[#142a19] px-7 py-7 shadow-2xl" [class.is-closing]="isClosing" role="dialog" aria-modal="true" aria-labelledby="section-register-title">
 <header class="mb-7 flex items-start justify-between"><div><h2 id="section-register-title" class="text-lg font-extrabold text-white">Register Section</h2><p class="mt-1 text-xs text-[#91a494]">Add a fence section for monitoring</p></div><button class="close" type="button" (click)="close()" aria-label="Close">×</button></header>
 <form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
  <div class="field"><label for="parent-fence">Parent Fence</label><select id="parent-fence" class="control font-semibold" formControlName="fenceCode">@for(fence of fences;track fence.code){<option [value]="fence.code">{{fence.code}} · {{fence.name}}</option>}</select></div>
  <div class="field"><label for="section-code">Section ID <span>(Auto-assigned)</span></label><input id="section-code" class="control font-mono" formControlName="sectionCode" /></div>
  <div class="grid grid-cols-2 gap-3"><div class="field"><label for="start-lat">Start Latitude</label><input id="start-lat" class="control font-mono" type="number" step=".0001" formControlName="startLatitude" /></div><div class="field"><label for="start-lng">Start Longitude</label><input id="start-lng" class="control font-mono" type="number" step=".0001" formControlName="startLongitude" /></div></div>
  <div class="grid grid-cols-2 gap-3"><div class="field"><label for="end-lat">End Latitude</label><input id="end-lat" class="control font-mono" type="number" step=".0001" formControlName="endLatitude" /></div><div class="field"><label for="end-lng">End Longitude</label><input id="end-lng" class="control font-mono" type="number" step=".0001" formControlName="endLongitude" /></div></div>
  <div class="grid grid-cols-2 gap-3"><div class="field"><label for="section-length">Section Length (km)</label><input id="section-length" class="control" type="number" min=".1" step=".1" formControlName="lengthKm" /></div><div class="field"><label for="section-date">Installation Date</label><input id="section-date" class="control" type="date" formControlName="installationDate" /></div></div>
  <div class="field"><label for="maintenance-notes">Maintenance Notes</label><textarea id="maintenance-notes" class="control min-h-20 resize-y py-2" placeholder="Notes..." formControlName="maintenanceNotes"></textarea></div>
  <div class="section-preview" aria-label="Fence section sequence preview">@for(item of [1,2,3,4,5,6,7];track item){<i></i>}<i class="new"></i><span>+new</span></div>
  @if(form.touched&&form.invalid){<p class="error">Complete all required fields using valid coordinates.</p>}
  <footer class="grid grid-cols-[.8fr_1.4fr] gap-3"><button class="secondary" type="button" [disabled]="isClosing" (click)="close()">Cancel</button><button class="primary" type="submit" [disabled]="isClosing">＋ Register Section</button></footer>
 </form>
</aside>
