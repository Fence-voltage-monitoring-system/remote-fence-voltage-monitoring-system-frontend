<section class="flex flex-col gap-4 rounded-xl border border-[#38513b] bg-[#172a1c] px-4 py-3.5 md:flex-row md:items-center">
  <div class="flex flex-col gap-2 sm:flex-row sm:items-center"><span class="text-[10px] font-bold uppercase tracking-[.1em] text-[#9ba897]">Selected Fence</span><select class="h-9 min-w-64 rounded-lg border border-[#3b5440] bg-[#203824] px-3 text-xs font-semibold text-white outline-none focus:border-[#43d36c]" [ngModel]="selected.code" (ngModelChange)="fenceChanged.emit($event)">@for (fence of fences; track fence.code) { <option [value]="fence.code">{{ fence.code }} · {{ fence.name }}</option> }</select></div>
  <div class="hidden h-8 w-px bg-[#566650] md:block"></div>
  <dl class="grid flex-1 grid-cols-2 gap-3 sm:grid-cols-4"><div><dt>Total Sections</dt><dd>{{ selected.totalSections }}</dd></div><div><dt>Total Length</dt><dd>{{ selected.totalLengthKm.toFixed(1) }} km</dd></div><div><dt>Operational</dt><dd>{{ selected.operational }} / {{ selected.totalSections }}</dd></div><div><dt>Average Voltage</dt><dd>{{ selected.averageVoltageKv.toFixed(1) }} kV</dd></div></dl>
</section>
