<div class="flex flex-col gap-2.5 border-b border-[#38513b] px-4 py-3 md:flex-row md:items-center">
  <label class="relative w-full md:w-52">
    <svg class="pointer-events-none absolute left-3 top-1/2 size-3.5 -translate-y-1/2 text-[#91a08d]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m20 20-4-4"></path>
    </svg>
    <input class="control w-full pl-8" type="search" placeholder="Search sections..." [ngModel]="search" (ngModelChange)="searchChange.emit($event)" />
  </label>

  <div class="grid grid-cols-1 gap-2.5 sm:grid-cols-3 md:flex md:flex-row">
    <select class="control w-full md:w-32" aria-label="Province" [disabled]="provinceLocked" [ngModel]="province" (ngModelChange)="provinceChange.emit($event)">
      <option value="">All Provinces</option>
      @for(item of provinces; track item){
        <option [value]="item">{{item}}</option>
      }
    </select>
    <select class="control w-full md:w-32" aria-label="District" [disabled]="districtLocked" [ngModel]="district" (ngModelChange)="districtChange.emit($event)">
      <option value="">All Districts</option>
      @for(item of districts; track item){
        <option [value]="item">{{item}}</option>
      }
    </select>
    <select class="control w-full md:w-28" aria-label="Section status" [ngModel]="status" (ngModelChange)="statusChange.emit($event)">
      <option value="">All Status</option>
      <option value="HEALTHY">Healthy</option>
      <option value="WARNING">Warning</option>
      <option value="CRITICAL">Critical</option>
      <option value="OFFLINE">Offline</option>
    </select>
  </div>

  <div class="hidden flex-1 md:block"></div>

  <div class="flex w-full items-center gap-2 md:w-auto">
    <button class="secondary flex flex-1 items-center justify-center md:flex-none" type="button" [disabled]="actionsDisabled" (click)="bulkAdd.emit()">Bulk Add</button>
    <button class="primary flex flex-1 items-center justify-center md:flex-none" type="button" [disabled]="actionsDisabled" (click)="register.emit()">＋ Register Section</button>
  </div>
</div>
