<main class="min-h-screen bg-[#263923] px-4 py-4 text-[#d9e2d6] sm:px-6">
  <div class="mx-auto max-w-[1800px]">
    <header class="mb-4 flex flex-wrap items-end justify-between gap-3">
      <div><p class="mb-1 text-[10px] font-bold uppercase tracking-[.18em] text-[#43d36c]">Management</p><h1 class="text-xl font-bold text-white">Fence Section Management</h1><p class="mt-1 text-xs text-[#9daa99]">Manage fence segments, devices and operational health</p></div>
      <div class="rounded-lg border border-[#356b42] bg-[#173d25] px-3 py-1.5 text-[10px] font-bold tracking-wider text-[#43d36c]">● SYSTEM ONLINE</div>
    </header>
    <app-section-overview [fences]="accessibleFences" [selected]="selectedFence" (fenceChanged)="selectFence($event)" />
    @if(notice){<div class="mt-3 rounded-lg border border-[#3c7448] bg-[#1d4328] px-3 py-2 text-xs text-[#74df90]">{{notice}}<button class="float-right" (click)="notice=''">×</button></div>}
    <section class="mt-4 overflow-hidden rounded-xl border border-[#50604c] bg-[#354a31]">
      <app-section-toolbar [search]="search" [status]="status" [province]="province" [district]="district" [provinces]="provinces" [districts]="districts" [provinceLocked]="access.scope().role !== 'SUPER_ADMIN'" [districtLocked]="access.scope().role === 'FIELD_ADMIN'" (searchChange)="search=$event" (statusChange)="status=$event" (provinceChange)="changeProvince($event)" (districtChange)="changeDistrict($event)" (bulkAdd)="openBulkAdd()" (register)="openRegistration()" />
      <app-section-table [sections]="filteredSections" (edit)="editSection($event)" />
    </section>
  </div>
</main>
@if(isRegistrationOpen){<app-section-registration-drawer [fences]="accessibleFences" [selectedFenceCode]="selectedFence.code" (closed)="closeRegistration()" (registered)="registerSection($event)"/>}
@if(selectedSection){<app-section-edit-modal [section]="selectedSection" [fences]="accessibleFences" (closed)="closeEdit()" (saved)="saveSection($event)"/>}
@if(isBulkAddOpen){<app-section-bulk-add-modal [fences]="accessibleFences" [selectedFenceCode]="selectedFence.code" (closed)="closeBulkAdd()" (imported)="importSections($event)"/>}
