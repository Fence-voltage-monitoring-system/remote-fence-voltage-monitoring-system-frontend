<main class="min-h-screen bg-[#263923] px-4 py-5 text-[#d9e2d6] sm:px-7"><div class="mx-auto max-w-[1800px]"><header class="mb-6 flex flex-wrap items-end justify-between gap-4"><div><p class="mb-1 text-xs font-bold uppercase tracking-[.18em] text-[#43d36c]">Management</p><h1 class="text-2xl font-bold text-white">Fence Section Management</h1><p class="mt-1 text-sm text-[#9daa99]">Manage fence segments, devices and operational health</p></div><div class="rounded-lg border border-[#356b42] bg-[#173d25] px-4 py-2 text-xs font-bold tracking-wider text-[#43d36c]">● SYSTEM ONLINE</div></header><app-section-overview [fences]="fences" [selected]="selectedFence" (fenceChanged)="selectFence($event)"/>@if(notice){<div class="mt-4 rounded-lg border border-[#3c7448] bg-[#1d4328] px-4 py-3 text-sm text-[#74df90]">{{notice}}<button class="float-right" (click)="notice=''">×</button></div>}<section class="mt-6 overflow-hidden rounded-2xl border border-[#50604c] bg-[#354a31]"><app-section-toolbar [search]="search" [status]="status" (searchChange)="search=$event" (statusChange)="status=$event" (bulkAdd)="message('Bulk section import is ready to configure.')" (register)="openRegistration()"/><app-section-table [sections]="filteredSections" (edit)="message($event.code+' selected for editing.')"/></section></div></main>@if(isRegistrationOpen){<app-section-registration-drawer [fences]="fences" [selectedFenceCode]="selectedFence.code" (closed)="closeRegistration()" (registered)="registerSection($event)"/>}
