<main><div class="page"><header><div><p>Operations</p><h1>Notifications</h1><span>Monitor operational events and delivery activity</span></div><button (click)="retry()" [disabled]="isLoading">Refresh</button></header><app-notification-summary [inApp]="stats.inApp" [websocket]="stats.websocket" [sms]="stats.smsDelivered" [unread]="unread"/>@if(isLoading){<div class="notice">Loading notifications…</div>}@if(error){<div class="api-error">{{error}}<button (click)="retry()">Retry</button></div>}@if(notice){<div class="notice">{{notice}}<button (click)="notice=''">×</button></div>}<section class="layout"><app-notification-feed [notifications]="visible" [loading]="isLoading" [pending]="isActionPending" [filter]="filter" [selectedId]="selected?.id??null" [unreadCount]="unread" (filterChange)="changeFilter($event)" (selected)="select($event)" (markAllRead)="markAll()" (clearRead)="clearRead()"/>@if(selected){<app-notification-detail [notification]="selected" (closed)="selected=null" (markRead)="markRead($event)" (viewAlert)="viewAlert($event)"/>}</section><nav class="pagination" aria-label="Notification pages"><button [disabled]="page===1||isLoading" (click)="changePage(page-1)">Previous</button><span>Page {{page}} of {{totalPages}} · {{totalItems}} notifications</span><button [disabled]="page>=totalPages||isLoading" (click)="changePage(page+1)">Next</button></nav></div></main>
