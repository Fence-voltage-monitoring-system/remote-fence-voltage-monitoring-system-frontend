<main><div class="page"><header><div><p>Operations</p><h1>Alerts</h1><span>Incident and alert management</span></div><b>● SYSTEM ONLINE</b></header><app-alert-summary [critical]="critical" [warnings]="warnings" [unacknowledged]="unacknowledged" [maintenance]="maintenance" [resolved]="resolved"/>@if(isLoading){<div class="notice">Loading alerts…</div>}@if(error){<div class="api-error">{{error}}<button (click)="retry()">Retry</button></div>}@if(notice){<div class="notice">{{notice}}<button (click)="notice=''">×</button></div>}<section class="layout"><app-alert-list [alerts]="visible" [filters]="filters" [selectedId]="selected?.id??null" [provinces]="provinces" [fences]="fences" [types]="types" (filtersChange)="updateFilters($event)" (selected)="selected=$event"/>@if(selected){<app-incident-panel [alert]="selected" [canAdminister]="access.canManage" [canMaintain]="access.scope().role==='MAINTENANCE'" (closed)="selected=null" (acknowledged)="acknowledge($event)" (accepted)="accept($event)" (declined)="decline($event)" (reassigned)="reassign($event)" (escalated)="escalate($event)" (workStarted)="startWork($event)" (workCompleted)="completeWork($event)" (resolved)="resolve($event)" (commentAdded)="addComment($event)"/>}@else{<aside class="empty">Select an alert to inspect the incident.</aside>}</section></div></main>
