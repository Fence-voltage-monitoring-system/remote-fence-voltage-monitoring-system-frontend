<section class="panel"><h2>Report Configuration</h2><div class="filters"><label>Province<select [disabled]="optionsLoading" [ngModel]="value.province" (ngModelChange)="update('province',$event)"><option value="">All Provinces</option>@for(item of provinces;track item.value){<option [value]="item.value">{{item.label}}</option>}</select></label><label>District<select [disabled]="optionsLoading||!value.province" [ngModel]="value.district" (ngModelChange)="update('district',$event)"><option value="">All Districts</option>@for(item of districts;track item.value){<option [value]="item.value">{{item.label}}</option>}</select></label><label>Fence<select [disabled]="optionsLoading" [ngModel]="value.fence" (ngModelChange)="update('fence',$event)"><option value="">{{fences.length?'All Fences':'No fences available'}}</option>@for(item of fences;track item.value){<option [value]="item.value">{{item.label}}</option>}</select></label><label>Section<select [disabled]="optionsLoading||!value.fence" [ngModel]="value.section" (ngModelChange)="update('section',$event)"><option value="">{{value.fence?'All Sections':'Select a fence first'}}</option>@for(item of sections;track item.value){<option [value]="item.value">{{item.label}}</option>}</select></label></div>
<h3>Date Range</h3><div class="range">@for(item of ranges;track item.id){<button type="button" [class.active]="value.range===item.id" (click)="setRange(item.id)">{{item.label}}</button>}</div>@if(value.range==='CUSTOM'){<div class="custom"><label>From<input type="date" [ngModel]="value.customFrom" (ngModelChange)="update('customFrom',$event)"/></label><label>To<input type="date" [ngModel]="value.customTo" (ngModelChange)="update('customTo',$event)"/></label></div>}
<div class="options"><label [class.disabled]="!chartsAvailable"><input type="checkbox" [disabled]="!chartsAvailable" [ngModel]="value.includeCharts" (ngModelChange)="update('includeCharts',$event)"/> Include Charts</label><label><input type="checkbox" [ngModel]="value.includeAlertHistory" (ngModelChange)="update('includeAlertHistory',$event)"/> Include Alert History</label><label><input type="checkbox" [ngModel]="value.includeMaintenanceRecords" (ngModelChange)="update('includeMaintenanceRecords',$event)"/> Include Maintenance Records</label></div>
<h3>Output Format</h3><div class="formats"><button type="button" [class.active]="value.format==='PDF'" (click)="setFormat('PDF')">◉ PDF</button><button type="button" [class.active]="value.format==='CSV'" (click)="setFormat('CSV')">● CSV</button></div>@if(!chartsAvailable){<p class="hint">CSV contains tabular data only, so charts are unavailable.</p>}@if(!valid){<p class="error">Select a valid custom date range.</p>}
<footer><button type="button" [disabled]="!valid||generating" (click)="previewRequested.emit()">◉ Preview</button><button class="generate" type="button" [disabled]="!valid||generating" (click)="generateRequested.emit()">{{generating?'Generating…':'▣ Generate Report'}}</button></footer></section>
