<div class="app-shell">
  <app-sidebar />
  <div class="page">
    <app-header />
    <main>
      <section class="page-intro">
        <div class="page-heading">
          <span>Fence Operations</span>
          <h1>Virtual Fence</h1>
          <p>Monitor every registered section and inspect live device telemetry in one place.</p>
        </div>
        <div class="page-tools">
          <button type="button" (click)="toggleFullscreen()" aria-label="Open fullscreen"><span aria-hidden="true">&#x26F6;</span> Fullscreen</button>
        </div>
      </section>

      <section class="monitor-card" aria-label="Virtual fence monitoring workspace">
        <app-fence-monitor [showSectionTable]="true" />
      </section>
    </main>
  </div>
</div>
