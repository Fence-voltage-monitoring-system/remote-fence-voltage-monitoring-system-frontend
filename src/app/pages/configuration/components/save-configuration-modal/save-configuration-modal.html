<div class="backdrop" (click)="!saving && closed.emit()"></div><section role="dialog" aria-modal="true"><header><div><h2>Confirm Configuration Change</h2><p>Review your changes and provide a reason for the configuration record.</p></div><button (click)="!saving && closed.emit()">×</button></header><label>Reason for change<textarea [disabled]="saving" [(ngModel)]="reason" placeholder="Explain why these settings are being changed..."></textarea></label>@if(error){<p role="alert" style="color:#ff9b90">{{error}}</p>}<footer><button class="cancel" (click)="!saving && closed.emit()">Cancel</button><button class="save" [disabled]="saving||!reason.trim()" (click)="confirmed.emit(reason.trim())">{{saving?'Saving…':'Save Configuration'}}</button></footer></section>
