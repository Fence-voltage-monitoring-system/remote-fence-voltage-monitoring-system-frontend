<div class="backdrop" (click)="closed.emit()"></div><section role="dialog" aria-modal="true"><header><div><h2>Confirm Configuration Change</h2><p>Threshold changes affect alert classification across the system.</p></div><button (click)="closed.emit()">×</button></header><label>Reason for change<textarea [(ngModel)]="reason" placeholder="Explain why these threshold values are being changed..."></textarea></label><footer><button class="cancel" (click)="closed.emit()">Cancel</button><button class="save" [disabled]="!reason.trim()" (click)="confirmed.emit(reason.trim())">Save Configuration</button></footer></section>
