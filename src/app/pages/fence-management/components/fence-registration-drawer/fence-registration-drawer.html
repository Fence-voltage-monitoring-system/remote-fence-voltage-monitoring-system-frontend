<div class="backdrop absolute inset-0 bg-[#020703]/75 backdrop-blur-[1px]" [class.is-closing]="isClosing" (click)="close()" aria-hidden="true"></div>
<aside class="drawer scrollbar-hidden absolute inset-y-0 right-0 w-full max-w-[510px] overflow-y-auto border-l border-[#304632] bg-[#142a19] px-7 py-7 shadow-2xl" [class.is-closing]="isClosing" role="dialog" aria-modal="true" aria-labelledby="register-fence-title">
  <header class="mb-7 flex items-start justify-between"><div><h2 id="register-fence-title" class="m-0 text-lg font-extrabold text-white">Register Fence</h2><p class="mt-1 text-xs text-[#91a494]">Add a new monitored fence to the system</p></div><button class="grid size-8 place-items-center rounded-lg border border-[#425543] bg-[#273a2a] text-xl text-[#a5b1a5] hover:text-white" type="button" (click)="close()" aria-label="Close registration form">×</button></header>
  <form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field"><label for="fence-name">Fence Name</label><input id="fence-name" class="control" formControlName="name" />@if (form.controls.name.touched && form.controls.name.invalid) { <small>Fence name is required.</small> }</div>
    <div class="field"><label for="fence-code">Fence Code</label><input id="fence-code" class="control font-mono" formControlName="code" />@if (form.controls.code.touched && form.controls.code.invalid) { <small>Use a code such as EPF-MNR-A.</small> }</div>
    <div class="grid grid-cols-2 gap-3"><div class="field"><label for="fence-province">Province</label><select id="fence-province" class="control" [value]="form.controls.province.value" (change)="changeProvince($any($event.target).value)">@for (province of provinces; track province) { <option [value]="province">{{ province }}</option> }</select></div><div class="field"><label for="fence-district">District</label><select id="fence-district" class="control" formControlName="district">@for (district of districts; track district) { <option [value]="district">{{ district }}</option> }</select></div></div>
    <div class="grid grid-cols-2 gap-3"><div class="field"><label for="fence-length">Total Length (km)</label><input id="fence-length" class="control" type="number" min="0.1" step="0.1" formControlName="lengthKm" /></div><div class="field"><label for="installation-date">Installation Date</label><input id="installation-date" class="control" type="date" formControlName="installationDate" /></div></div>
    <div class="field"><label for="fence-gateway">Assigned Gateway</label><select id="fence-gateway" class="control font-mono" formControlName="gateway">@for (gateway of gateways; track gateway) { <option [value]="gateway">{{ gateway }}</option> }</select></div>
    <div class="grid grid-cols-2 gap-3"><div class="field"><label for="start-gps">Start GPS (lat, lng)</label><input id="start-gps" class="control font-mono" formControlName="startGps" /></div><div class="field"><label for="end-gps">End GPS (lat, lng)</label><input id="end-gps" class="control font-mono" formControlName="endGps" /></div></div>
    <div class="field"><label for="fence-description">Description</label><textarea id="fence-description" class="control min-h-16 resize-y py-2" formControlName="description" placeholder="Brief description of fence location and purpose..."></textarea></div>
    <div class="map-preview" aria-label="Sri Lanka location preview">
      <svg viewBox="0 0 130 190" aria-hidden="true"><path d="M70 5C48 8 38 25 36 48c-3 29 8 48 2 73-5 22-1 45 22 63 15-18 20-36 24-57 4-23 20-43 14-72C94 32 87 12 70 5Z"/><path class="route" d="M61 31c7 27 4 49 9 71 4 15-5 29-5 45"/><circle cx="69" cy="80" r="4"/></svg>
      <span>Sri Lanka · Location Preview</span>
    </div>
    <footer class="mt-1 grid grid-cols-[.8fr_.8fr_1.35fr] gap-2"><button class="secondary" type="button" [disabled]="isClosing" (click)="close()">Cancel</button><button class="secondary" type="button" [disabled]="isClosing" (click)="saveDraft()">Save Draft</button><button class="primary" type="submit" [disabled]="isClosing">＋ Register Fence</button></footer>
  </form>
</aside>
