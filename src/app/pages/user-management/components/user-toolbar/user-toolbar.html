<section class="flex flex-col gap-3 border-b border-[#53614d] p-3 lg:flex-row lg:items-center" aria-label="User filters">
  <label class="relative min-w-0 flex-1">
    <span class="sr-only">Search users</span>
    <svg class="pointer-events-none absolute top-1/2 left-3 size-4 -translate-y-1/2 fill-none stroke-[#8f9a8a] stroke-[1.7]" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
    <input class="h-10 w-full rounded-lg border border-[#586651] bg-[#3d4c38] pr-3 pl-10 text-xs text-[#edf2eb] outline-none placeholder:text-[#99a395] focus:border-[#42d46c]" type="search" placeholder="Search by name or email..." [ngModel]="filters.search" (ngModelChange)="updateFilter('search', $event)" />
  </label>
  <div class="grid grid-cols-2 gap-2 sm:grid-cols-4 lg:flex">
    <select class="filter-select" aria-label="Filter by role" [ngModel]="filters.role" (ngModelChange)="updateFilter('role', $event)"><option value="">All Roles</option><option value="SUPER_ADMIN">Super Administrator</option><option value="REGIONAL_ADMIN">Regional Administrator</option><option value="FIELD_ADMIN">Field Administrator</option><option value="MAINTENANCE">Maintenance</option></select>
    <select class="filter-select" aria-label="Filter by province" [ngModel]="filters.province" (ngModelChange)="updateFilter('province', $event)"><option value="">All Provinces</option>@for (province of provinces; track province) { <option [value]="province">{{ province }}</option> }</select>
    <select class="filter-select" aria-label="Filter by status" [ngModel]="filters.status" (ngModelChange)="updateFilter('status', $event)"><option value="">All Status</option><option value="ACTIVE">Active</option><option value="INACTIVE">Inactive</option></select>
    <button class="flex h-10 items-center justify-center gap-2 rounded-lg bg-[#43d36c] px-5 text-xs font-bold text-[#071c0d] transition hover:bg-[#5be181]" type="button" (click)="createUser.emit()"><span class="text-lg leading-none">+</span> Create User</button>
  </div>
</section>
