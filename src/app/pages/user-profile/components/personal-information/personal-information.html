<section class="h-full rounded-2xl border border-[#465c45] bg-[#263c28] p-5 shadow-lg"><header class="mb-5 flex items-center justify-between"><div><h2 class="m-0 text-sm font-bold">Personal Information</h2><p class="mt-1 text-[10px] text-[#8f9f91]">Your account and contact details</p></div><button class="rounded-lg border border-[#426448] bg-[#294831] px-3 py-2 text-[10px] font-semibold text-[#63dd82] hover:bg-[#31583b]" type="button" (click)="editRequested.emit()">Edit Details</button></header><dl class="grid gap-x-6 gap-y-5 sm:grid-cols-2"><div><dt class="profile-label">Full Name</dt><dd>{{ profile.fullName }}</dd></div><div><dt class="profile-label">Username</dt><dd>{{ profile.username }}</dd></div><div><dt class="profile-label">Email Address</dt><dd>{{ profile.email }}</dd></div><div><dt class="profile-label">Contact Number</dt><dd>{{ profile.contactNumber }}</dd></div><div><dt class="profile-label">Department</dt><dd>{{ profile.department }}</dd></div><div><dt class="profile-label">Account Created</dt><dd>{{ profile.createdAt }}</dd></div></dl></section>
