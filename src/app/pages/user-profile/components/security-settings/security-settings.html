<section class="card-base h-full">
  <header class="card-header">
    <div>
      <h2>Security & Sessions</h2>
      <p>Active session controls and device management.</p>
    </div>
  </header>

  <div class="grid gap-3 p-5">
    <div class="flex items-center justify-between gap-4 rounded-xl border border-[#304735] bg-[#112316] p-4">
      <div>
        <strong class="block text-[11px] font-semibold text-[#edf4e9]">Other Devices & Sessions</strong>
        <span class="text-[8.5px] text-[#8fa08c]">Last login: {{ profile.lastLoginAt }}</span>
      </div>
      <button class="cursor-pointer rounded-xl border border-[#405943] px-3.5 py-2 text-[8.5px] text-[#ff756e] hover:border-[#ff756e] hover:bg-[#2b1616] disabled:opacity-50" type="button" [disabled]="isSigningOut" (click)="signOutOthers.emit()">
        {{ isSigningOut ? 'Signing Out…' : 'Sign Out Others' }}
      </button>
    </div>
  </div>
</section>
