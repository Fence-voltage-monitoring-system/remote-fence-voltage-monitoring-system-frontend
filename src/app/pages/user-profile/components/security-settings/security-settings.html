<section class="rounded-2xl border border-[#465c45] bg-[#263c28] p-5 shadow-lg"><header class="mb-5"><h2 class="m-0 text-sm font-bold">Security</h2><p class="mt-1 text-[10px] text-[#8f9f91]">Password and active session controls</p></header><div class="grid gap-3"><div class="flex items-center justify-between gap-4 rounded-xl border border-[#38513b] bg-[#203525] p-4"><div><strong class="block text-xs">Password</strong><span class="text-[9px] text-[#89998b]">Last changed {{ profile.passwordChangedAt }}</span></div><button class="rounded-lg bg-[#43d36c] px-3 py-2 text-[10px] font-bold text-[#09200e] hover:bg-[#59df7d]" type="button" (click)="changePassword.emit()">Change Password</button></div><div class="flex items-center justify-between gap-4 rounded-xl border border-[#38513b] bg-[#203525] p-4"><div><strong class="block text-xs">Other Sessions</strong><span class="text-[9px] text-[#89998b]">Last login {{ profile.lastLoginAt }}</span></div><button class="rounded-lg border border-[#526354] px-3 py-2 text-[10px] text-[#c3ccc2] hover:border-[#d15343] hover:text-[#ff8678] disabled:cursor-not-allowed disabled:opacity-60" type="button" [disabled]="isSigningOut" (click)="signOutOthers.emit()">{{ isSigningOut ? 'Signing Out…' : 'Sign Out Others' }}</button></div></div></section>
