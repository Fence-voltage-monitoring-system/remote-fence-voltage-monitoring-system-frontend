<div class="profile-page-container">
  <section class="heading">
    <div>
      <span>Account</span>
      <h1>My Profile</h1>
      <p>Manage your personal details, operational assignments and account security.</p>
    </div>
    <button class="primary-btn" type="button" (click)="isEditProfileOpen = true">Edit profile</button>
  </section>

  @if (isLoadingProfile) {
    <div class="mb-4 h-1 overflow-hidden rounded-full bg-[#1b3421]"><div class="h-full w-1/3 animate-pulse rounded-full bg-[#4ee672]"></div></div>
  }

  @if (notice) {
    <div class="status-notice" role="status">
      <span>{{ notice }}</span>
      @if (profileLoadFailed) {
        <button class="rounded-md border border-[#2d6b3a] bg-[#1d4826] px-3 py-1 text-[8px] font-semibold text-[#55e777] hover:bg-[#255c30]" type="button" (click)="loadProfile()">Retry</button>
      }
    </div>
  }

  <div class="grid gap-5">
    <app-profile-summary [profile]="profile" />
    
    <div class="grid items-stretch gap-5 lg:grid-cols-[1.3fr_.9fr]">
      <app-personal-information [profile]="profile" (editRequested)="isEditProfileOpen = true" />
      <app-assignment-summary [profile]="profile" />
    </div>

    <app-notification-preferences [preferences]="notificationPreferences" [isSaving]="isSavingNotificationPreferences" (saved)="saveNotificationPreferences($event)"/>

    <div class="grid items-start gap-5 lg:grid-cols-2">
      <app-security-settings [profile]="profile" [isSigningOut]="isSigningOutOtherSessions" (changePassword)="isChangePasswordOpen = true" (signOutOthers)="signOutOtherSessions()" />
      <app-activity-list [activities]="profile.recentActivity" />
    </div>
  </div>
</div>

@if (isEditProfileOpen) {
  <app-profile-edit-drawer [profile]="profile" (closed)="isEditProfileOpen = false" (profileUpdated)="applyProfileUpdate($event)" />
}

@if (isChangePasswordOpen) {
  <app-change-password-drawer (closed)="isChangePasswordOpen = false" (passwordChanged)="completePasswordChange($event)" />
}
