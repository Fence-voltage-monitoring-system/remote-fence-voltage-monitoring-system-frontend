<article class="chart-card"><header><div class="title-block"><span class="kicker"><i></i> VOLTAGE PERFORMANCE</span><h2>Voltage trend</h2><p>{{ subtitle }}</p></div><div class="chart-actions"><div class="legend"><span><i class="actual"></i>Actual</span><span><i class="warning-key"></i>Warning</span><span><i class="critical-key"></i>Critical</span></div><button type="button" aria-label="More chart options">•••</button></div></header><div class="metric-row"><div class="primary-metric"><span>Current voltage</span><strong>{{ currentVoltage }} <small>kV</small></strong><b [class]="statusClass">● {{ statusText }}</b></div><div><span>Average</span><strong>{{ avgVoltage }} <small>kV</small></strong></div><div><span>Peak</span><strong>{{ peakVoltage }} <small>kV</small></strong></div><div><span>Lowest</span><strong class="amber">{{ lowestVoltage }} <small>kV</small></strong></div><em><i></i> {{ statusText }}</em></div><div class="chart-wrap"><svg viewBox="0 0 1200 230" preserveAspectRatio="none" role="img" aria-label="Voltage trend"><defs><linearGradient id="voltage-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#54ef83" stop-opacity=".34"/><stop offset=".58" stop-color="#35cf70" stop-opacity=".08"/><stop offset="1" stop-color="#35cf70" stop-opacity="0"/></linearGradient><linearGradient id="voltage-stroke" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#31d978"/><stop offset=".45" stop-color="#7ff39b"/><stop offset="1" stop-color="#42df82"/></linearGradient><filter id="line-glow"><feGaussianBlur stdDeviation="5"/></filter></defs><rect x="55" y="105" width="1110" height="40" class="warning-zone"/><rect x="55" y="145" width="1110" height="50" class="critical-zone"/>@for(y of [25,65,105,145,195];track y){<line x1="55" [attr.y1]="y" x2="1165" [attr.y2]="y" class="grid"/>}@for(label of [{y:29,t:'8 kV'},{y:69,t:'6 kV'},{y:109,t:'4 kV'},{y:149,t:'2 kV'},{y:199,t:'0'}];track label.t){<text x="6" [attr.y]="label.y" class="axis-y">{{label.t}}</text>}<line x1="55" y1="105" x2="1165" y2="105" class="warning"/><g class="threshold-pill warning-pill"><rect x="1054" y="91" width="111" height="18" rx="9"/><text x="1109" y="103">WARNING · {{ identity.warningKv() }} {{ identity.voltageUnit() }}</text></g><line x1="55" y1="145" x2="1165" y2="145" class="critical"/><g class="threshold-pill critical-pill"><rect x="1055" y="131" width="110" height="18" rx="9"/><text x="1110" y="143">CRITICAL · {{ identity.criticalKv() }} {{ identity.voltageUnit() }}</text></g>@if(areaPath){<path class="area" [attr.d]="areaPath"/>}@if(trendPath){<path class="trend-glow" [attr.d]="trendPath"/><path class="trend" [attr.d]="trendPath"/>}@for(point of points;track point.time + $index){<g class="data-point"><circle class="point-halo" [attr.cx]="point.x" [attr.cy]="point.y" r="9"/><circle class="point-core" [attr.cx]="point.x" [attr.cy]="point.y" r="3.5"/><title>{{point.time}} · {{point.value}}</title></g>}@if(latestPoint){<line [attr.x1]="latestPoint.x" [attr.y1]="latestPoint.y" [attr.x2]="latestPoint.x" y2="195" class="current-guide"/><circle [attr.cx]="latestPoint.x" [attr.cy]="latestPoint.y" r="13" class="current-pulse"/><circle [attr.cx]="latestPoint.x" [attr.cy]="latestPoint.y" r="5" class="current-dot"/><g class="current-tooltip"><rect [attr.x]="latestPoint.x > 1050 ? latestPoint.x - 110 : latestPoint.x - 55" y="36" width="110" height="34" rx="8"/><text [attr.x]="latestPoint.x > 1050 ? latestPoint.x - 98 : latestPoint.x - 43" y="49" class="tooltip-time">{{latestPoint.time}} · CURRENT</text><text [attr.x]="latestPoint.x > 1050 ? latestPoint.x - 98 : latestPoint.x - 43" y="63" class="tooltip-value">{{latestPoint.value}}</text></g>}@else{<text x="600" y="115" text-anchor="middle" fill="#698066" font-size="12">No telemetry recorded for this selection / period</text>}<g class="labels">@if(points.length > 1){@for(p of points;track p.time + $index){<text [attr.x]="p.x" y="220" text-anchor="middle">{{p.time}}</text>}}@else{<text x="55" y="220">Start</text><text x="1145" y="220">End</text>}</g></svg></div></article>
