<article class="chart-card">
  <header><h2>Voltage Trend</h2><p>{{subtitle}}</p></header>
  <svg viewBox="0 0 1200 155" preserveAspectRatio="none" role="img" aria-label="Voltage trend chart generated from dummy data">
    <defs><linearGradient id="voltage-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43d36c" stop-opacity=".16"/><stop offset="1" stop-color="#43d36c" stop-opacity="0"/></linearGradient></defs>
    @for(y of [20,55,90,125];track y){<line x1="30" [attr.y1]="y" x2="1180" [attr.y2]="y" class="grid"/>}
    <line x1="30" y1="72" x2="1180" y2="72" class="warning"/>
    <line x1="30" y1="108" x2="1180" y2="108" class="critical"/>
    <polygon class="area" [attr.points]="areaPoints"/>
    <polyline class="trend" [attr.points]="points"/>
    @for(point of coordinates;track $index){<circle class="data-point" [attr.cx]="point.x" [attr.cy]="point.y" r="2"><title>{{point.value.toFixed(2)}} kV</title></circle>}
    <g class="labels">@for(label of labels;track $index){<text [attr.x]="labelX($index)" y="148" [attr.text-anchor]="$index===0?'start':$index===labels.length-1?'end':'middle'">{{label}}</text>}</g>
  </svg>
</article>
