<section class="filter-bar"><div class="selects"><select [disabled]="provinceLocked" [ngModel]="filters.province" (ngModelChange)="update('province',$event)"><option value="">All Provinces</option>@for(item of provinces;track item){<option [value]="item">{{item}}</option>}</select><select [disabled]="districtLocked" [ngModel]="filters.district" (ngModelChange)="update('district',$event)"><option value="">All Districts</option>@for(item of districts;track item){<option [value]="item">{{item}}</option>}</select><select [ngModel]="filters.fence" (ngModelChange)="update('fence',$event)"><option value="">All Fences</option>@for(item of fences;track item){<option [value]="item">{{item}}</option>}</select><select [ngModel]="filters.section" (ngModelChange)="update('section',$event)"><option value="">All Sections</option>@for(item of sections;track item){<option [value]="item">{{item}}</option>}</select><select [ngModel]="filters.device" (ngModelChange)="update('device',$event)"><option value="">All Devices</option>@for(item of devices;track item){<option [value]="item">{{item}}</option>}</select></div><div class="periods">@for(period of periods;track period){<button [class.active]="filters.period===period" (click)="selectPeriod(period)">{{period==='custom'?'Custom':period}}</button>}</div><div class="actions"><button (click)="compare.emit()">≋ Compare Sections</button><button (click)="exportAnalysis.emit()">⇩ Export Analysis</button></div></section>
@if(showCustomRange){<div class="range-backdrop" (click)="closeCustom()"></div><section class="range-modal" role="dialog" aria-modal="true" aria-labelledby="range-title"><header><div><h2 id="range-title">Custom Analysis Range</h2><p>Select the exact historical period to analyse</p></div><button (click)="closeCustom()">×</button></header><div class="range-fields"><label>Start Date & Time<input type="datetime-local" [(ngModel)]="customStart"/></label><label>End Date & Time<input type="datetime-local" [(ngModel)]="customEnd"/></label></div>@if(customError){<p class="range-error">{{customError}}</p>}<footer><button class="range-cancel" (click)="closeCustom()">Cancel</button><button class="range-apply" (click)="applyCustom()">Apply Range</button></footer></section>}
