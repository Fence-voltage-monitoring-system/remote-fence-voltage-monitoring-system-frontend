<section class="filter-panel"><header><div><span>FILTERS</span><strong>Refine analysis</strong></div><small>Choose an area, asset, and time period</small></header><div class="filter-content"><div class="selects"><label><span>Province</span><select [disabled]="provinceLocked" [ngModel]="filters.province" (ngModelChange)="update('province',$event)"><option value="">All provinces</option>@for(item of provinces;track item){<option [value]="item">{{item}}</option>}</select></label><label><span>District</span><select [disabled]="districtLocked" [ngModel]="filters.district" (ngModelChange)="update('district',$event)"><option value="">All districts</option>@for(item of districts;track item){<option [value]="item">{{item}}</option>}</select></label><label><span>Fence</span><select [ngModel]="filters.fence" (ngModelChange)="update('fence',$event)"><option value="">All fences</option>@for(item of fences;track item){<option [value]="item">{{item}}</option>}</select></label><label><span>Section</span><select [ngModel]="filters.section" (ngModelChange)="update('section',$event)"><option value="">All sections</option>@for(item of sections;track item){<option [value]="item">{{item}}</option>}</select></label><label><span>Device</span><select [ngModel]="filters.device" (ngModelChange)="update('device',$event)"><option value="">All devices</option>@for(item of devices;track item){<option [value]="item">{{item}}</option>}</select></label></div><div class="filter-footer"><div class="period-wrap"><span>TIME RANGE</span><div class="periods">@for(period of periods;track period){<button type="button" [class.active]="filters.period===period" (click)="selectPeriod(period)">{{period==='custom'?'Custom':period}}</button>}</div></div><div class="actions"><button type="button" class="compare" (click)="compare.emit()"><span>⇄</span> Compare sections</button><button type="button" class="export app-primary-action" (click)="exportAnalysis.emit()"><span>↓</span> Export analysis</button></div></div></div></section>@if(showCustomRange){<div class="range-backdrop" (click)="closeCustom()"></div><section class="range-modal" role="dialog" aria-modal="true" aria-labelledby="range-title"><header><div><h2 id="range-title">Custom analysis range</h2><p>Select the exact historical period to analyse</p></div><button (click)="closeCustom()">×</button></header><div class="range-fields"><label>Start date & time<input type="datetime-local" [(ngModel)]="customStart"/></label><label>End date & time<input type="datetime-local" [(ngModel)]="customEnd"/></label></div>@if(customError){<p class="range-error">{{customError}}</p>}<footer><button class="range-cancel" (click)="closeCustom()">Cancel</button><button class="range-apply app-primary-action" (click)="applyCustom()">Apply range</button></footer></section>}
