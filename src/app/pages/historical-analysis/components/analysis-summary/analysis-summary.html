<section class="metrics">@for(metric of metrics;track metric.label;let index=$index){<article [class]="'metric metric-'+index"><div class="metric-top"><span class="metric-icon">@switch(index){@case(0){↗}@case(1){↓}@case(2){↑}@case(3){≈}@case(4){!}@default{✓}}</span><em [class]="metric.tone">{{index===4?'Needs review':'Operational'}}</em></div><span class="label">{{metric.label}}</span><div class="value"><strong [class]="metric.tone">{{metric.value}}</strong>@if(metric.unit){<small>{{metric.unit}}</small>}</div><i><b [style.width.%]="index===4?38:index===3?87:76"></b></i></article>}</section>
