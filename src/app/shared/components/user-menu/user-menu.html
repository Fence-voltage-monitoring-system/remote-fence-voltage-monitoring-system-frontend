<button
  class="trigger"
  type="button"
  aria-haspopup="menu"
  [attr.aria-expanded]="open"
  (click)="toggle()"
>
  <span class="avatar">{{ userInitials }}</span>
  <span class="identity"><strong>{{ userName }}</strong><small>{{ userRole }}</small></span>
</button>

<div class="dropdown" [class.open]="open" role="menu" aria-label="User account">
  <div class="account">
    <span class="avatar large">{{ userInitials }}</span>
    <div><strong>{{ userName }}</strong><span>{{ userEmail }}</span><small>{{ userRole }}</small></div>
  </div>

  <div class="menu-section">
    <button type="button" role="menuitem" routerLink="/profile" (click)="choose()"><i data-menu-icon="UserRound"></i><span><strong>My profile</strong><small>Personal details and contact info</small></span></button>
    <button type="button" role="menuitem" routerLink="/notifications" (click)="choose()"><i data-menu-icon="BellRing"></i><span><strong>Notifications</strong><small>View operational notifications</small></span>@if (unread > 0) { <em>{{ unread }}</em> }</button>
  </div>

  <div class="menu-section">
    <button type="button" role="menuitem" routerLink="/security" (click)="choose()"><i data-menu-icon="ShieldCheck"></i><span><strong>Security</strong><small>Sessions and access activity</small></span></button>
    <button type="button" role="menuitem" routerLink="/appearance" (click)="choose()"><i data-menu-icon="Palette"></i><span><strong>Appearance</strong><small>Theme and display options</small></span></button>
    <button type="button" role="menuitem" (click)="navigateTo('/help-support')"><i data-menu-icon="CircleHelp"></i><span><strong>Help &amp; support</strong><small>Documentation and assistance</small></span></button>
  </div>

  <div class="menu-section sign-out">
    <button type="button" role="menuitem" (click)="requestSignOut()"><i data-menu-icon="LogOut"></i><span><strong>Sign out</strong><small>End the current session</small></span></button>
  </div>
</div>
