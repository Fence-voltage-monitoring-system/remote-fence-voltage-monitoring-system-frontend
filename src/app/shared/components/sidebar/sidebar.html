<!-- Desktop Persistent Icon Sidebar (Hidden on mobile < md) -->
<aside class="desktop-sidebar hidden md:block">
  <div class="logo" role="img" aria-label="Remote fence monitoring"></div>

  <nav aria-label="Main navigation">
    @for (item of visibleItems; track item.label) {
      <button
        type="button"
        [routerLink]="item.route ?? null"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        [attr.aria-label]="item.label"
        [attr.title]="item.label"
        (click)="activeItem = item.label"
      >
        <i [attr.data-lucide]="item.icon"></i>
        <span class="tooltip" role="tooltip">{{ item.label }}</span>
      </button>
    }
  </nav>
</aside>

<!-- Mobile Slide-out Drawer (Visible only on mobile < md when toggled) -->
@if (navService.isMobileNavOpen()) {
  <div
    class="mobile-backdrop fixed inset-0 z-[2490] bg-black/60 backdrop-blur-xs md:hidden"
    aria-hidden="true"
    (click)="navService.closeMobileNav()"
  ></div>

  <aside class="mobile-drawer fixed inset-y-0 left-0 z-[2500] flex w-72 max-w-[85vw] flex-col border-r border-[#234329] bg-[#0d1f13] text-[#edf4e9] shadow-2xl md:hidden">
    <div class="mobile-drawer-header flex h-16 items-center justify-between border-b border-[#234329] px-4">
      <div class="flex items-center gap-2.5">
        <span class="block size-8 rounded-lg bg-[url('/assets/full_logo.png')] bg-contain bg-center bg-no-repeat"></span>
        <div class="leading-tight">
          <strong class="block text-xs font-bold text-[#edf4e9]">NERDC / DWC</strong>
          <span class="block text-[10px] text-[#55e777]">Fence Monitor SL</span>
        </div>
      </div>
      <button
        type="button"
        class="grid size-8 cursor-pointer place-items-center rounded-lg border border-[#315238] bg-[#142d1a] text-[#a8b5a4] hover:bg-[#1f4228] hover:text-[#4ee672]"
        (click)="navService.closeMobileNav()"
        aria-label="Close navigation"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto px-2 py-3" aria-label="Mobile navigation">
      <div class="flex flex-col gap-1">
        @for (item of visibleItems; track item.label) {
          <a
            [routerLink]="item.route ?? null"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.route === '/' }"
            class="mobile-nav-link flex items-center gap-3 rounded-xl px-3 py-2.5 text-xs font-medium text-[#9eb49f] transition-colors hover:bg-[#16351e] hover:text-[#4ee672]"
            (click)="onItemClick(item.label)"
          >
            <i [attr.data-lucide]="item.icon" class="size-4 shrink-0"></i>
            <span class="truncate">{{ item.label }}</span>
          </a>
        }
      </div>
    </nav>

    <div class="border-t border-[#234329] p-3 text-center text-[10px] text-[#6b826d]">
      <span>National Fence Monitoring &middot; v2.4.1</span>
    </div>
  </aside>
}
