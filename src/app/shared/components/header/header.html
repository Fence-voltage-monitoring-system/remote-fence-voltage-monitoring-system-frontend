<header>
  <div class="brand-mark">&#128024;</div>
  <div class="brand"><strong>DWC &middot; SRI LANKA</strong><span>Wildlife Conservation</span><b>Remote Voltage Monitoring System</b><small>Live Operations System</small></div>
  <div class="crumb">Operations&nbsp; / &nbsp;{{ pageName() }}</div>
  <div class="status"><i></i> SYSTEM ONLINE</div>
  <div class="clock"><strong>{{ currentTime() }}</strong><span>{{ currentDate() }} &middot; UTC+5:30</span></div>
  <button class="bell" type="button" aria-label="Notifications, 2 unread" title="Notifications"><i data-lucide="bell"></i><em>2</em></button>
  <app-user-menu />
  <button class="view-action" type="button" (click)="toggleFullscreen()" [attr.aria-label]="fullscreen() ? 'Exit fullscreen' : 'Open page in fullscreen'" [attr.title]="fullscreen() ? 'Exit fullscreen' : 'Fullscreen'">
      @if (fullscreen()) {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6" /></svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6" /></svg>
      }
  </button>
</header>
